sonar.projectKey=marufkhan20_pizzashop-auth-service
sonar.organization=marufkhan20
sonar.sources=src
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,**/migration/**/*

# server.ts is the process entrypoint: it invokes startServer() as an
# import-time side effect (opens a real DB connection, binds a real
# port), so it cannot be safely imported into a Jest test and will never
# be covered by unit tests. Excluded from coverage metrics only — it
# still gets analyzed for bugs/smells like everything else.
sonar.coverage.exclusions=src/server.ts

sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.scm.exclusions.disabled=true